name: Console checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Isolate console state
        # Runner context is available in steps, but not in job-level env.
        run: |
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/openshell-config" >> "$GITHUB_ENV"
          echo "OPENSHELL_CONSOLE_DATA_DIR=$RUNNER_TEMP/openshell-console-data" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node server/cli.js --version
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: openshell-console-${{ matrix.os }}-node${{ matrix.node }}
          path: ui/openshell-console-*.tgz
          if-no-files-found: error
