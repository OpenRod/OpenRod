name: Console checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ui
    env:
      XDG_CONFIG_HOME: ${{ runner.temp }}/openshell-config
      OPENSHELL_CONSOLE_DATA_DIR: ${{ runner.temp }}/openshell-console-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: node --test server/*.test.js src/lib/*.test.js
      - run: npm run build
      - run: node server/cli.js --version
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: openshell-console-${{ matrix.os }}-node${{ matrix.node }}
          path: ui/openshell-console-*.tgz
          if-no-files-found: error
