name: Console checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Isolate console state
        # Runner context is available in steps, but not in job-level env.
        run: |
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/openshell-config" >> "$GITHUB_ENV"
          echo "OPENSHELL_CONSOLE_DATA_DIR=$RUNNER_TEMP/openshell-console-data" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install browser for regression checks
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npx playwright install --with-deps chromium
      - name: Browser regression checks
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npx e2e run
        env:
          E2E_TELEMETRY_DISABLED: '1'
      - run: node server/cli.js --version
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openrod-${{ matrix.os }}-node${{ matrix.node }}
          path: ui/openrod-*.tgz
          if-no-files-found: error
