name: Identity

# Keeps personal emails and retired names out of new commits (see CONTRIBUTING.md).
# The runner's preinstalled Node runs the dependency-free script, so no setup is needed.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  identity:
    name: identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit emails and terms
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
          IDENTITY_BLOCKLIST: ${{ secrets.IDENTITY_BLOCKLIST }}
        run: node .github/scripts/identity-check.js "$BASE_SHA..$HEAD_SHA"
