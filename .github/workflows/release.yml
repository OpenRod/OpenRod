name: Release

# Publishes the npm package and the GitHub release for a pushed v* tag.
# npm trusted publishing (OIDC) needs no stored token and adds provenance.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: ui
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Isolate console state
        run: |
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/openshell-config" >> "$GITHUB_ENV"
          echo "OPENSHELL_CONSOLE_DATA_DIR=$RUNNER_TEMP/openshell-console-data" >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1
      - run: npm publish --provenance --access public
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
