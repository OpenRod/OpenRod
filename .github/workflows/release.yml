name: Release

# Publishes the npm package and the GitHub release for a pushed v* tag.
# npm trusted publishing (OIDC) needs no stored token and adds provenance.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: ui
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Isolate console state
        run: |
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/openshell-config" >> "$GITHUB_ENV"
          echo "OPENSHELL_CONSOLE_DATA_DIR=$RUNNER_TEMP/openshell-console-data" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1
      - run: npm publish --provenance --access public
        # Only published packages report usage, and only after a user opts in.
        env:
          OPENROD_ANALYTICS_RELEASE: '1'
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
