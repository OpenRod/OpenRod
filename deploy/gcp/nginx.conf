# GCP appends the actual client IP and forwarding-rule IP to X-Forwarded-For.
# Capture the penultimate value; ignore any attacker-supplied prefix.
# The VPC firewall permits only GCP load balancer/health-check sources here.
map $http_x_forwarded_for $openrod_client_ip {
    default $remote_addr;
    "~(?:^|,)\s*(?<openrod_forwarded_client>[0-9a-fA-F:.]+)\s*,\s*[0-9a-fA-F:.]+\s*$" $openrod_forwarded_client;
}
map $http_upgrade $openrod_connection {
    default upgrade;
    '' close;
}
server {
    listen 8080 default_server;
    server_name _;
    client_max_body_size 64m;
    location = /healthz {
        proxy_pass http://127.0.0.1:4600;
        proxy_set_header Host $http_host;
    }
    location / {
        proxy_pass http://127.0.0.1:4600;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $openrod_connection;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-OpenRod-Client-IP $openrod_client_ip;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
