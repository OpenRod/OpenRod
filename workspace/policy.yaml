# Policy for the shared workspace sandbox that Claude desktop and the Codex app
# open over SSH. Anything not listed here is blocked and shows up in the
# console's Approvals page.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: best_effort
network_policies:
  # Claude desktop deploys its server and CLI to ~/.claude/remote/ on first
  # connect and forwards the desktop sign-in, so no login happens in here.
  agent-claude:
    name: agent-claude
    binaries:
      - path: /usr/local/bin/claude
      - path: /sandbox/.claude/remote/**
    endpoints:
      - { host: api.anthropic.com, port: 443, protocol: rest, access: read-write, enforcement: enforce }
      - { host: claude.ai, port: 443, protocol: rest, access: read-write, enforcement: enforce }
      - { host: platform.claude.com, port: 443, protocol: rest, access: read-write, enforcement: enforce }
      - { host: downloads.claude.ai, port: 443, protocol: rest, access: read-only, enforcement: enforce }
  # The Codex app starts `codex app-server` here; sign in once with
  # `ssh openshell-workspace codex login --device-auth`.
  agent-codex:
    name: agent-codex
    binaries:
      - path: /usr/local/bin/codex
      - path: /usr/local/lib/node_modules/@openai/**/codex
    endpoints:
      - { host: api.openai.com, port: 443, protocol: rest, access: read-write, enforcement: enforce }
      - { host: auth.openai.com, port: 443, protocol: rest, access: read-write, enforcement: enforce }
      - { host: chatgpt.com, port: 443, protocol: rest, access: read-write, enforcement: enforce }
      - { host: ab.chatgpt.com, port: 443, protocol: rest, access: read-write, enforcement: enforce }
  # Clone over HTTPS (fetches are POSTs, hence read-write). Pushing still needs
  # a credential attached separately.
  git-github:
    name: git-github
    binaries:
      - path: /usr/lib/git-core/git-remote-http
      - path: /usr/lib/git-core/git-remote-https
    endpoints:
      - { host: github.com, port: 443, protocol: rest, access: read-write, enforcement: enforce }
