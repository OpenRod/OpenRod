# Custom OpenShell provider profile: Claude Code with a Claude subscription
# (Pro/Max) instead of an API key. Based on NVIDIA's providers/claude-code.yaml.
#
# The token comes from `claude setup-token` on your Mac. Claude Code reads it
# from CLAUDE_CODE_OAUTH_TOKEN and sends it as "Authorization: Bearer ...".
# The sandbox only sees a placeholder; the OpenShell proxy swaps in the real
# token for requests to the endpoints below.

id: claude-code-subscription
display_name: Claude Code (subscription)
description: Claude Code CLI authenticated with a Claude subscription token
category: agent
inference_capable: true
credentials:
  - name: oauth_token
    description: Long-lived Claude subscription token from `claude setup-token`
    env_vars: [CLAUDE_CODE_OAUTH_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [oauth_token]
endpoints:
  - host: api.anthropic.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: statsig.anthropic.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: sentry.io
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/usr/bin/claude, /usr/local/bin/claude]
